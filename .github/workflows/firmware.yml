# Builds FM1 firmware on a Windows runner, because the JieLi PI32v2 toolchain
# is Windows-only. Produces a .fwsc file as a build artifact; nothing is flashed.
name: FM1 firmware

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      KIT: ${{ github.workspace }}\firmware\kit
      TOOLCHAIN_URL: https://pkgman.jieliapp.com/s/win-toolchain
    steps:
      # The SDK checks SHA-256 hashes of its files, so line endings must not change.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - name: Check for the dev kit
        run: |
          $present = Test-Path "$env:KIT\sdk\manifest.json"
          if (!$present) { Write-Host '::notice::firmware/kit is not in the repo yet; skipping the build.' }
          "KIT_PRESENT=$($present.ToString().ToLower())" >> $env:GITHUB_ENV

      - name: Cache JieLi toolchain
        if: env.KIT_PRESENT == 'true'
        id: cache
        uses: actions/cache@v4
        with:
          path: C:\jl
          key: jieli-toolchain-${{ hashFiles('firmware/kit/sdk/manifest.json') }}

      - name: Download and unpack JieLi toolchain
        if: env.KIT_PRESENT == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force C:\jl-download, C:\jl | Out-Null
          $installer = 'C:\jl-download\toolchain.exe'
          Invoke-WebRequest -Uri $env:TOOLCHAIN_URL -OutFile $installer -MaximumRedirection 10
          $info = Get-Item $installer
          Write-Host "Downloaded $($info.Length) bytes"
          $head = [IO.File]::ReadAllBytes($installer)
          $text = [Text.Encoding]::ASCII.GetString($head)
          foreach ($marker in 'Nullsoft', 'Inno Setup', '7-Zip', 'WiX') {
            if ($text.Contains($marker)) { Write-Host "Installer looks like: $marker" }
          }
          # The download is an Inno Setup installer. Unpack it with innoextract
          # first, which never runs it; running the installer silently hung for
          # more than 7 minutes on the first try, so it is only a timed fallback.
          choco install innoextract -y --no-progress | Out-Null
          innoextract --version
          innoextract -l $installer | Select-String -Pattern 'clang|pi32v2|llvm' | Select-Object -First 40 | ForEach-Object { Write-Host $_ }
          innoextract -s -d C:\jl\unpacked $installer
          Write-Host "innoextract exit code: $LASTEXITCODE"
          $found = Get-ChildItem C:\jl\unpacked -Recurse -Filter pi32v2-ld.exe -ErrorAction SilentlyContinue
          if (!$found) {
            Write-Host 'innoextract found no pi32v2-ld.exe; running the installer silently for up to 5 minutes.'
            $log = 'C:\jl-download\install.log'
            $p = Start-Process $installer -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/DIR=C:\jl\installed', "/LOG=$log"
            if (!$p.WaitForExit(300000)) { Write-Host 'Installer still running after 5 minutes; stopping it.'; $p | Stop-Process -Force }
            Get-Process | Where-Object { $_.Path -like '*jl*' -or $_.Path -like 'C:\Users\*\AppData\Local\Temp\*' } | ForEach-Object { Write-Host "Still running: $($_.Path)" }
            $places = 'C:\jl', 'C:\JL', 'C:\Program Files', 'C:\Program Files (x86)', $env:LOCALAPPDATA, $env:APPDATA, 'C:\ProgramData'
            $found = $places | Where-Object { $_ -and (Test-Path $_) } | ForEach-Object {
              Get-ChildItem $_ -Recurse -Filter pi32v2-ld.exe -ErrorAction SilentlyContinue }
          }
          $found | ForEach-Object { Write-Host "Found: $($_.FullName)" }
          $i = 0
          foreach ($f in $found) {
            $root = $f.Directory.Parent.FullName
            if (!$root.StartsWith('C:\jl\', [StringComparison]::OrdinalIgnoreCase)) {
              Copy-Item $root "C:\jl\copy$i" -Recurse; $i++
            }
          }

      - name: Save installer log
        if: always() && env.KIT_PRESENT == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jieli-install-log
          path: C:\jl-download\install.log
          if-no-files-found: ignore

      - name: Find the toolchain that matches the SDK
        if: env.KIT_PRESENT == 'true'
        run: |
          $manifest = Get-Content "$env:KIT\sdk\manifest.json" -Raw | ConvertFrom-Json
          $want = $manifest.external_toolchain.files
          $roots = Get-ChildItem C:\jl -Recurse -Filter clang.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'bin' } | ForEach-Object { $_.Directory.Parent.FullName }
          if (!$roots) { throw 'No bin\clang.exe found in the downloaded toolchain.' }
          $match = $null
          foreach ($root in $roots) {
            $missing = @()
            foreach ($entry in $want.PSObject.Properties) {
              $file = Join-Path $root $entry.Name
              if (!(Test-Path $file) -or (Get-FileHash $file -Algorithm SHA256).Hash.ToLower() -ne $entry.Value) { $missing += $entry.Name }
            }
            Write-Host "$root : $($missing.Count) of $(@($want.PSObject.Properties).Count) files differ $($missing -join ', ')"
            if (!$missing) { $match = $root; break }
          }
          if ($match) {
            "TOOLCHAIN_EXACT=true" >> $env:GITHUB_ENV
          } else {
            # JieLi's current download is newer than the kit's clang 4.0.1 r3.
            # Build anyway as a compile and link check only: point the runner's
            # copy of the manifest at the installed files. Never commit this,
            # and never flash what it produces.
            $match = @($roots)[0]
            Write-Host "::warning::No exact clang 4.0.1 r3 toolchain. Building a compile check with $match; its firmware is not for flashing."
            foreach ($entry in $want.PSObject.Properties) {
              $file = Join-Path $match $entry.Name
              if (Test-Path $file) { $entry.Value = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower() }
            }
            $manifest | ConvertTo-Json -Depth 8 | Set-Content "$env:KIT\sdk\manifest.json" -Encoding utf8NoBOM
            "TOOLCHAIN_EXACT=false" >> $env:GITHUB_ENV
          }
          & (Join-Path $match 'bin\clang.exe') --version
          "FM1_PI32_TOOLCHAIN=$match" >> $env:GITHUB_ENV

      - name: Build firmware
        if: env.KIT_PRESENT == 'true'
        shell: powershell
        run: '& "$env:KIT\sdk\Build.ps1" -FirmwareOnly'

      - name: Report free RAM
        if: env.KIT_PRESENT == 'true'
        run: |
          $nm = Join-Path $env:FM1_PI32_TOOLCHAIN 'bin\llvm-nm.exe'
          $symbols = & $nm "$env:KIT\build\dx7\sdk.elf" | Select-String -Pattern '\b_?(HEAP_BEGIN|HEAP_END|MALLOC_SIZE)\b'
          $symbols | ForEach-Object { Write-Host $_ }
          $symbols | ForEach-Object { "- ``$_``" } | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: env.KIT_PRESENT == 'true' && env.TOOLCHAIN_EXACT == 'true'
        with:
          name: fm1-firmware-${{ github.sha }}
          path: |
            firmware/kit/build/dx7/generated/*.fwsc
            firmware/kit/build/dx7/sdk.elf
            firmware/kit/build/dx7/*.map
          if-no-files-found: warn

      # A build made with a non-matching toolchain keeps only the link outputs
      # for inspection; there is deliberately no .fwsc to flash.
      - uses: actions/upload-artifact@v4
        if: env.KIT_PRESENT == 'true' && env.TOOLCHAIN_EXACT == 'false'
        with:
          name: compile-check-NOT-FOR-FLASHING-${{ github.sha }}
          path: |
            firmware/kit/build/dx7/sdk.elf
            firmware/kit/build/dx7/*.map
          if-no-files-found: warn
