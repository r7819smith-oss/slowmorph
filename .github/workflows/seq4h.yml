name: seq4h aarch64 build

# Builds seq4h for Knulli on the RG40XX-V (64-bit ARM) with
# sequencer/knulli/build.sh, the same script you can run locally. It
# cross-compiles in an Ubuntu 20.04 container (glibc 2.31, so the binary runs
# on any Knulli release), links SDL2 and ALSA dynamically so the device's own
# copies are used, runs the unit tests natively and under qemu, and packages a
# zip in the Ports layout.

permissions:
  contents: read

on:
  push:
    paths: ['sequencer/**', '.github/workflows/seq4h.yml']
  pull_request:
    paths: ['sequencer/**', '.github/workflows/seq4h.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        run: sequencer/knulli/build.sh
      # The zip is uploaded inside the artifact because artifacts drop the
      # execute bit; the zip keeps it.
      - uses: actions/upload-artifact@v4
        with:
          name: seq4h-knulli-aarch64
          path: |
            sequencer/dist/seq4h-knulli-aarch64.zip
            sequencer/dist/seq4h
